<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{{ project.title }} - 演示放映</title>
    <link rel="stylesheet" href="/static/antd/app.css?v=20261101-creation-assistant">
    <link rel="stylesheet" href="/static/css/pages/project/presentation.css?v=20261024-viewer-theme">
</head>
<body class="presentation-page">
    <main class="presentation-container" aria-label="幻灯片放映">
        <div class="slide-display">
            <div class="loading-overlay" id="loadingOverlay"></div>
            <div class="slide-frame-container" id="slideFrameContainer"></div>
        </div>
    </main>
    <div id="antdRoot"></div>
    <script type="application/json" id="antdData">{{ {
        "page": "presentation", "projectId": project.project_id, "title": project.title,
        "slidesCount": slides_count, "slidesData": project.slides_data, "updatedAt": project.updated_at,
        "isShared": is_shared|default(false), "shareToken": share_token|default(""),
        "hasSpeechScripts": has_speech_scripts|default(false),
        "narrationLanguages": narration_languages|default(['zh','en'])
    }|tojson }}</script>
    <script src="/static/js/pages/project/presentation.js?v=20261011"></script>
    <script type="module" src="/static/antd/app.js?v=20261024-navigation"></script>
</body>
</html>
