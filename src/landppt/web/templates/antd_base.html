<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark light">
    <link rel="stylesheet" href="/static/css/shared/design-tokens.css?v=20261023">
    <script src="/static/js/shared/theme-init.js?v=20261025"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LandPPT{% endblock %}</title>
    <link rel="icon" href="/static/images/favicon.ico">
    <link rel="stylesheet" href="/static/antd/app.css?v=20261101-creation-assistant">
    <link rel="stylesheet" href="/static/css/shared/site_notice.css?v=20261023-workspace">
    <link rel="stylesheet" href="/static/css/shared/notify.css?v=20261023-workspace">
    <link rel="stylesheet" href="/static/css/shared/notification_center.css?v=20261023-workspace">
</head>
<body>
    {% set current_user = user if user is defined else (request.state.user if request and request.state and request.state.user else none) %}
    {% block blueprint %}{% endblock %}
    <script id="antdData" type="application/json">{
        "user": {% if current_user %}{"username": {{ current_user.username | tojson }}, "is_admin": {{ current_user.is_admin | tojson }}}{% else %}null{% endif %},
        "creditsEnabled": {{ (credits_enabled | default(false)) | tojson }},
        {% block page_data %}{% endblock %}
    }</script>
    <div id="antdRoot"><div class="app-startup" role="status" aria-label="正在打开页面"><span></span><span></span><span></span></div></div>
    <noscript>请启用 JavaScript 后使用 LandPPT。</noscript>
    <script src="/static/js/shared/notify.js?v=20260726"></script>
    <script src="/static/js/shared/site_notice.js?v=20260322"></script>
    <script src="/static/js/shared/notification_center.js?v=20261012-antd"></script>
    <script type="module" src="/static/antd/app.js?v=20261024-navigation"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
